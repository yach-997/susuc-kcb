name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_BASE: ./
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-cdn:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite HTML assets to jsDelivr
        run: node scripts/rewrite-cdn-html.mjs

      - name: Publish CDN mirror branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-cdn-branch.sh

  deploy-shipstatic:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy ShipStatic (fixed domain)
        continue-on-error: true
        env:
          SHIP_API_KEY: ${{ secrets.SHIP_API_KEY }}
          SHIP_DOMAIN: ${{ vars.SHIP_DOMAIN }}
        run: |
          set +e
          if [ -z "${SHIP_API_KEY:-}" ]; then
            echo "未配置 SHIP_API_KEY，跳过国内固定域名部署。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash scripts/deploy-shipstatic-ci.sh | tee -a "$GITHUB_STEP_SUMMARY"
          rc=$?
          echo "### 国内固定地址（同学收藏这一个）" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${SHIP_DOMAIN:-susuc-kcb.shipstatic.com}/" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "⚠️ ShipStatic 自动上传未成功（GitHub 国外节点常见），GitHub Pages 已更新。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
